spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: ${app.oss.max-file-size:100MB}
      max-request-size: ${app.oss.max-file-size:100MB}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${app.secure.datasource.url}
    username: ${app.secure.datasource.username}
    password: ${app.secure.datasource.password}
  data:
    redis:
      host: ${app.secure.redis.host}
      port: ${app.secure.redis.port}
      password: ${app.secure.redis.password}
      database: ${app.secure.redis.database}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100
  rabbitmq:
    host: ${app.secure.rabbitmq.host}
    port: ${app.secure.rabbitmq.port}
    virtual-host: ${app.secure.rabbitmq.virtual-host}
    username: ${app.secure.rabbitmq.username}
    password: ${app.secure.rabbitmq.password}
    connection-timeout: 1s
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        multiplier: 1
        max-attempts: 3
      mandatory: true
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms
  ai:
    deepseek:
      api-key: ${app.secure.ai.deepseek.api-key}
      chat:
      embedding:
        enabled: false
        options:
          model: deepseek-chat
          temperature: 0.3
          max-tokens: 1024
    openai:
      base-url: ${app.secure.ai.openai.base-url}
      api-key: ${app.secure.ai.openai.api-key}
      embedding:
        enabled: true
        options:
          model: text-embedding-v4

    vectorstore:
      qdrant:
        host: ${app.secure.ai.vectorstore.qdrant.host}
        port: ${app.secure.ai.vectorstore.qdrant.port}
        collection-name: vector_store

elasticsearch:
  host: ${app.secure.elasticsearch.host}
  port: ${app.secure.elasticsearch.port}
  scheme: ${app.secure.elasticsearch.scheme}
  connection-timeout: 10s
  socket-timeout: 30s
  connection-request-timeout: 5s

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted

app:
  oss:
    endpoint: ${app.secure.oss.endpoint}
    bucket: ${app.secure.oss.bucket}
    access-key-id: ${app.secure.oss.access-key-id}
    access-key-secret: ${app.secure.oss.access-key-secret}
    public-base-url: ${app.secure.oss.public-base-url}
    max-file-size: ${app.secure.oss.max-file-size:100MB}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - application/pdf
      - application/zip
      - application/x-zip-compressed
      - application/x-rar-compressed
      - application/octet-stream
      - video/mp4
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - pdf
      - zip
      - rar
      - 7z
      - mp4
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # 前后端分离场景下从 satoken 请求头读取 token
  is-read-header: true
  # 不再通过 cookie 读取登录态
  is-read-cookie: false
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
