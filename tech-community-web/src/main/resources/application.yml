spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tech_community?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456 # 刚才在数据库工具里填的那个
  # Redis 配置
  data:
    redis:
      host: 192.168.44.167
      port: 6379
      password: 123456
      database: 2
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100
  #rabbitMQ 配置
  rabbitmq:
    host: 192.168.44.167
    port: 5672
    virtual-host: /tech-community
    username: root
    password: 123456
    connection-timeout: 1s
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        multiplier: 1
        max-attempts: 3
      mandatory: true
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms



# Elasticsearch 配置
elasticsearch:
  host: 192.168.44.167
  port: 9200
  scheme: http  # 由于是关闭安全认证，使用http
  # 连接池配置
  connection-timeout: 10s
  socket-timeout: 30s
  connection-request-timeout: 5s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启 SQL 日志打印，方便调试
  global-config:
    db-config:
      logic-delete-field: deleted # 对应数据库里的逻辑删除字段
